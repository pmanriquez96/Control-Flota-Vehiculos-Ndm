<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" href="/logo.png"><script src="/shim.js"></script></head><body>
<title>Registro Vehículos NDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: bitácora de taller. Barra de kilometraje arriba, selector de vehículos, y ficha con pendientes, historial y papeles. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f4f6f9; --ink:#15212c; --muted:#556676; --line:#d2dae2;
  --accent:#0f5c9e; --accent-ink:#ffffff; --accent-soft:#e1eefa;
  --ok-solid:#17703f; --warn-solid:#9a5b00; --bad-solid:#b3261e; --solid-ink:#ffffff; --ok:#17703f; --ok-soft:#e0f2e7; --warn:#8f5200; --warn-soft:#fcefd3; --bad:#b3261e; --bad-soft:#fbe3e0;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#17202a; --surface2:#1d2833; --ink:#e7edf2; --muted:#9aabba; --line:#2b3947;
  --accent:#5aaaf0; --accent-ink:#08202f; --accent-soft:#16324a;
  --ok-solid:#5fd08d; --warn-solid:#f2b45a; --bad-solid:#ff8f86; --solid-ink:#0b1218; --ok:#5fd08d; --ok-soft:#173626; --warn:#f2b45a; --warn-soft:#3b2d12; --bad:#ff8f86; --bad-soft:#412120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#17202a; --surface2:#1d2833; --ink:#e7edf2; --muted:#9aabba; --line:#2b3947;
  --accent:#5aaaf0; --accent-ink:#08202f; --accent-soft:#16324a;
  --ok-solid:#5fd08d; --warn-solid:#f2b45a; --bad-solid:#ff8f86; --solid-ink:#0b1218; --ok:#5fd08d; --ok-soft:#173626; --warn:#f2b45a; --warn-soft:#3b2d12; --bad:#ff8f86; --bad-soft:#412120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top.brandbar{background:#0a0d10;border-radius:var(--r);padding:14px 18px;color:#fff}
.top.brandbar h1{color:#fff}
.top.brandbar .sub,.top.brandbar .sync{color:#a9b6bc}
.brandwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brandwrap img{height:70px;width:auto;display:block;max-width:100%}
.top.brandbar h1{font-size:24px;line-height:1.15}
@media (max-width:520px){.brandwrap img{height:48px}.top.brandbar h1{font-size:20px}}
.sub{color:var(--muted)}
.sync{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:13px;color:var(--muted)}
.kmbar{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kmbar h2{margin-bottom:10px}
.kmbar form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:10px;align-items:end}
.kmbar label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.kmbar input,.kmbar select{background:var(--surface);color:var(--ink);border:1px solid transparent;border-radius:8px;min-height:44px;padding:0 10px;width:100%}
.kmbar .hint{color:var(--ink);margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.kmbar .hint.warnbox{color:var(--bad);font-weight:600;border-color:var(--bad)}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.kmbar .btn.pri{background:var(--surface);color:var(--ink);border-color:var(--surface);min-height:44px;padding:0 22px;font-weight:700}
a.btn{color:var(--ink)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;min-height:0}
.strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);background:var(--surface)}
.strip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.strip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.strip.ok{color:var(--ok)}
.strip ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative;min-width:0}
.chip b{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.chip.add{border-style:dashed;justify-content:center;align-items:center;color:var(--accent);font-weight:700;font-size:15px;min-height:72px}
.chip .km{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.chip .st{margin-top:4px}
.plate{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;font-size:14px;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;background:var(--surface);color:var(--ink);display:inline-block;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:5px;line-height:1.5;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface2);color:var(--muted)}
.pill.ok::before{content:"✓";font-weight:700}
.pill.warn::before{content:"!";font-weight:700}
.pill.bad::before{content:"✕";font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lab{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.colL,.colR{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){
  .vgrid{display:flex;flex-direction:column}.colL,.colR{display:contents}.a-pend{order:1}.a-hist{order:2}.a-stock{order:3}.a-pap{order:4}.a-km{order:5}.a-pauta{order:6}.a-acc{order:7}
  .kmbar form{grid-template-columns:1fr 1fr}
  .kmbar form .btn{grid-column:1/-1}
}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list>li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
ul.list>li:first-child{border-top:0}
.grow{flex:1;min-width:180px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.kmtag{font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:13px;white-space:nowrap}
.mhead{font-family:var(--font-display);font-size:17px;font-weight:700;margin:14px 0 2px;color:var(--accent);text-transform:capitalize}
.mhead:first-child{margin-top:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.fl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:6px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form .full{grid-column:1/-1}
.my{display:grid;grid-template-columns:1.4fr 1fr;gap:6px}
.dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted);font-size:13.5px}
.dl dd{margin:0;overflow-wrap:anywhere;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td .sub2{display:block;font-size:12.5px;color:var(--muted)}
.rowbtn{background:none;border:0;text-align:left;padding:0;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.rowbtn:hover b{text-decoration:underline}
.empty{color:var(--muted);padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600}
/* Checklist */
.chk-sec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chk-sec>h3{background:var(--surface2);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.chk-row .nt{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:7px 12px;font-size:13.5px;font-weight:600;min-width:64px;text-align:center;background:var(--surface)}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span.o{background:var(--ok-solid);color:var(--solid-ink)}
.seg input:checked+span.r{background:var(--warn-solid);color:var(--solid-ink)}
.seg input:checked+span.f{background:var(--bad-solid);color:var(--solid-ink)}
@media (max-width:520px){.chk-row{grid-template-columns:minmax(0,1fr)}.seg{width:100%}.seg label{flex:1}}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:-3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.msg{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;overflow-wrap:anywhere}
.checkline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checkline input[type=checkbox]{width:20px;height:20px}
.checkline input[type=number]{width:110px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface)}
details>summary{cursor:pointer;font-weight:600;min-height:32px}
.solo .tabs,.solo #alertStrip,.solo .kmbar,.solo .gowrap,.solo #recent{display:none}
.chofer nav{display:none}
.gowrap{position:relative}
.gomenu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:270px;max-width:88vw;max-height:70vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.3);padding:6px;display:flex;flex-direction:column;gap:2px}
.gomenu[hidden]{display:none}
.gomenu .gh{font-size:12px;color:var(--muted);padding:6px 10px 4px}
.gomenu button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;min-height:44px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.gomenu button:hover,.gomenu button:focus-visible{background:var(--accent-soft)}
.gomenu .plate{font-weight:500}
.tick{width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1;background:var(--surface);flex:none}
.tick.on{background:var(--ok-solid);border-color:var(--ok-solid);color:var(--solid-ink)}
.stk{list-style:none;margin:0;padding:0}
.stk>li{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:2px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.stk>li.hd{border-top:0;padding:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stk>li>.hd2{text-align:center}
.stk .stk-l{grid-column:1/-1;font-size:13px;color:var(--muted)}
.stk .q{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.uses{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface2)}
.use{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.use input[type=checkbox]{width:20px;height:20px;flex:none}
.use small{color:var(--muted)}
.use .amt{width:90px;min-height:34px}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:0 8px;margin:2px 4px 0 0;color:var(--muted)}
.cam{position:relative;display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:0 9px;min-height:28px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);vertical-align:middle}
.cam svg{width:16px;height:16px;flex:none}
.cam input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs:empty{display:none}
.thumb{position:relative}
.thumb img{width:68px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.thumb.wait{width:68px;height:68px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.thumb .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad-solid);color:var(--solid-ink);font-size:15px;line-height:1;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.segm{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.segm label{position:relative;cursor:pointer}
.segm input{position:absolute;opacity:0;inset:0;cursor:pointer}
.segm span{display:block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:600;background:var(--surface)}
.segm input:checked+span{background:var(--bad-solid);border-color:var(--bad-solid);color:var(--solid-ink)}
.segm input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">

      cb(d);

/* ---------- cálculo de estado ---------- */
function curKm(id){
  var e=(S.km[id]&&S.km[id].entries)||[]; if(!e.length)return null;
  var best=null;
  e.forEach(function(x,i){ if(!best|| x.d>best.d || (x.d===best.d && (x.km>=best.km||true))) best=x; });
  return best;
}
function mantSt(v){
  var c=curKm(v.id), thr=Number(S.cfg.mantKm)||1000;
  if(!v.nextKm) return {s:'none',txt:'Sin definir',rem:null};
  if(!c) return {s:'none',txt:'Sin km actual',rem:null};
  var rem=v.nextKm-c.km;
  if(rem<0) return {s:'bad',txt:'Pasada por '+fmt(-rem)+' km',rem:rem};
  if(rem<=thr) return {s:'warn',txt:'Faltan '+fmt(rem)+' km',rem:rem};
  return {s:'ok',txt:'Faltan '+fmt(rem)+' km',rem:rem};
}
function dueSt(m,dia){
  if(!m) return {s:'none',txt:'Sin fecha'};
  var p=m.split('-').map(Number), y=p[0], mo=p[1];
  var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  var end=dia?new Date(y,mo-1,dia):new Date(y,mo,0);
  var lastPrev=new Date(y,mo-1,0); var start=new Date(lastPrev.getFullYear(),lastPrev.getMonth(),lastPrev.getDate()-6);
  var lab=(dia?dia+' ':'')+mlab(m);
  if(t>end) return {s:'bad',txt:'Vencido',lab:lab,start:start};
  if(t>=start) return {s:'warn',txt:'Renovar',lab:lab,start:start};
  return {s:'ok',txt:'Vigente',lab:lab,start:start};
}
function pill(st,txt){return '<span class="pill '+st.s+'">'+esc(txt||st.txt)+'</span>'}
function worst(list){var o={bad:3,warn:2,ok:1,none:0},w='ok';list.forEach(function(s){if(o[s]>o[w])w=s});return w}
function vehStatus(v){return worst([mantSt(v).s,dueSt(v.rt,v.rtDia).s,dueSt(v.permiso).s].map(function(x){return x==='none'?'ok':x}))}
function buildAlerts(all){
  var out=[];
  vlist().forEach(function(v){
    var ms=mantSt(v), c=curKm(v.id);
    if((all||S.cfg.mantOn)&&(ms.s==='warn'||ms.s==='bad')){
      out.push({v:v,kind:'Mantención',s:ms.s,txt:ms.s==='bad'?'pasó el kilometraje de la próxima mantención por '+fmt(-ms.rem)+' km (actual '+fmt(c.km)+' km, próxima '+fmt(v.nextKm)+' km)':'faltan '+fmt(ms.rem)+' km (actual '+fmt(c.km)+' km, próxima '+fmt(v.nextKm)+' km)'});
    }
    [['rt','Revisión técnica',v.rt,v.rtDia,'rtOn'],['perm','Permiso de circulación',v.permiso,null,'permOn']].forEach(function(x){
      var st=dueSt(x[2],x[3]);
      if((all||S.cfg[x[4]])&&(st.s==='warn'||st.s==='bad')){
        out.push({v:v,kind:x[1],s:st.s,txt:(st.s==='bad'?'vencida desde ':'vence ')+st.lab.replace(/^\d+ /,function(d){return d})});
      }
    });
  });
  var o={bad:0,warn:1};
  return out.sort(function(a,b){return o[a.s]-o[b.s]});
}

/* ---------- repuestos y stock ---------- */
var ITEMS=[['aire','Filtro de aire'],['comb','Filtro de combustible'],['faceite','Filtro de aceite'],['polen','Filtro de polen'],['aceite','Aceite de motor']];
function r2(x){return Math.round(x*100)/100}
function norm(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function detect(text,uso){
  var t=norm(text), u={};
  t=t.replace(/filtros?\s+(de\s+)?(aceite|motor)/g,' xfaceite ');
  var todos=/todos\s+(los\s+)?filtros/.test(t), hasF=/filtros?|\bf\./.test(t);
  if(/xfaceite/.test(t)||todos||/aceite[^.;\n]*\by\s+filtros?\b(?!\s+de\s+(aire|combustible|polen))/.test(t)) u.faceite=1;
  if(todos||(hasF&&/\baire\b(?!\s+acondicionado)/.test(t))) u.aire=1;
  if(todos||(hasF&&/combustible/.test(t))) u.comb=1;
  if(/polen/.test(t)) u.polen=1;
  var t2=t.replace(/aceite\s+(de\s+)?(caja|diferencial|hidraulic\w*)/g,' ').replace(/xfaceite/g,' ');
  if(/aceite/.test(t2)){var m=t2.match(/(\d+(?:[.,]\d+)?)\s*bidon(?:es)?\b/);u.aceite=m?parseFloat(m[1].replace(',','.')):(uso||1);u.faceite=1}
  return u;
}
function usosOf(e,v){return e.usos||detect(e.text,(v&&v.aceiteUso)||1)}
/* resta del stock lo usado; devuelve lo realmente descontado. Si el repuesto no tiene stock registrado, no se toca. */
function applyStock(d,old,usos){
  d.stock=d.stock||{};
  if(old&&old.managed&&old.desc) Object.keys(old.desc).forEach(function(k){ if(d.stock[k]!=null) d.stock[k]=r2(d.stock[k]+old.desc[k]) });
  var desc={};
  Object.keys(usos||{}).forEach(function(k){
    var s=d.stock[k]; if(s==null){desc[k]=0;return}
    var take=Math.min(usos[k],s); d.stock[k]=r2(s-take); desc[k]=r2(take);
  });
  return desc;
}
function restoreStock(d,e){
  if(!(e&&e.managed&&e.desc)) return;
  d.stock=d.stock||{};
  Object.keys(e.desc).forEach(function(k){ if(d.stock[k]!=null) d.stock[k]=r2(d.stock[k]+e.desc[k]) });
}
function stockMsg(v,usos,desc){
  var parts=[], sin=[];
  Object.keys(usos).forEach(function(k){
    var nm=ITEMS.filter(function(i){return i[0]===k})[0][1];
    if(desc[k]>0) parts.push(nm+' −'+fmt(desc[k])+(k==='aceite'?' '+(v.aceiteUnidad||'bidones'):''));
    else sin.push(nm);
  });
  return (parts.length?' · Stock descontado: '+parts.join(', '):'')+(sin.length?' · Sin stock registrado de: '+sin.join(', '):'');
}
function stockInfo(v){
  var H=(v.history||[]).map(function(e,i){return {e:e,i:i,u:usosOf(e,v)}}).filter(function(x){return Object.keys(x.u).length});
  H.sort(function(a,b){var ma=a.e.month||'',mb=b.e.month||'';return ma<mb?-1:ma>mb?1:a.i-b.i});
  var last={}, latest=null;
  H.forEach(function(x){Object.keys(x.u).forEach(function(k){last[k]={month:x.e.month,km:x.e.km}})});
  if(H.length){
    var lm=H[H.length-1].e.month||'', set={}, km=null;
    H.forEach(function(x){ if((x.e.month||'')===lm){ Object.keys(x.u).forEach(function(k){set[k]=1}); if(x.e.km!=null) km=Math.max(km||0,x.e.km) } });
    latest={month:lm,km:km,set:set};
  }
  return {last:last,latest:latest};
}
function stockTxt(v,k,s){
  if(s==null) return '<span class="pill none">Sin dato</span>';
  if(s<=0) return '<span class="pill bad">Sin stock</span>';
  return '<span class="q">'+fmt(s)+'</span>'+(k==='aceite'?' <span class="hint">'+esc(v.aceiteUnidad||'bidones')+'</span>':'');

var queues={};
function toast(msg,kind,undo){
  var box=$('#toastBox'); box.innerHTML='';
  var d=document.createElement('div'); d.className='toast'+(kind==='bad'?' bad':''); d.setAttribute('role','status');
  d.appendChild(document.createTextNode(msg));

  box.appendChild(d); clearTimeout(toast.t); toast.t=setTimeout(function(){box.innerHTML=''},undo?7000:3500);
}
function errMsg(e){
  if(e&&e.code==='permission_denied') return 'Tu usuario no tiene permiso para esta acción.';
  if(e&&e.code==='invalid_argument') return 'No se pudo guardar. Puede que no tengas permiso para editar.';
  if(e&&e.code==='quota_exceeded') return 'Se llenó el espacio de datos. Borra registros antiguos.';
  return 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
}
function persist(path,patch,replace){
  if(!db){toast('Los datos no están conectados.','bad');return Promise.resolve()}
  var prev=queues[path]||Promise.resolve();
  var p=prev.then(function(){
    var ref=db.doc(path);
    return replace?ref.set(patch):ref.update(patch).catch(function(e){ if(e&&e.code==='invalid_argument') return ref.set(patch); throw e; });
  }).catch(function(e){ toast(errMsg(e),'bad') });
  queues[path]=p; return p;
}

function chkStats(x){
  var fails=Object.keys(x.items||{}).filter(function(k){return x.items[k]==='malo'||x.items[k]==='falla'});
  var regs=Object.keys(x.items||{}).filter(function(k){return x.items[k]==='regular'});
  if(Array.isArray((x.items||{}).ctab)&&x.items.ctab.length) fails.push('ctab');
  var answered=chkKeys().filter(function(k){return (x.items||{})[k]}).length;
  var nfot=Object.keys(x.fotos||{}).reduce(function(n,k){return n+x.fotos[k].length},0);
  return {fails:fails,regs:regs,answered:answered,sinrev:chkKeys().length-answered,nfot:nfot};
}
function renderRecent(){
  var el=$('#recent'), show=(ui.tab==='veh'||ui.tab==='flota')&&Object.keys(S.veh).length>0;
  el.hidden=!show; if(!show) return;

  var h='<header><h3>Últimos checklists</h3><span class="hint">De toda la flota, del más reciente al más antiguo</span></header>';
  if(!L.length){el.innerHTML=h+'<p class="empty">Todavía no se ha hecho ningún checklist.</p>';return}
  var shown=L.slice(0,ui.recentAll?20:5);
  h+='<ul class="list">'+shown.map(function(x){
    var v=S.veh[x.vid], st=chkStats(x);
    var pills=(st.fails.length?pill({s:'bad'},st.fails.length+(st.fails.length===1?' malo':' malos')):'')+(st.regs.length?pill({s:'warn'},st.regs.length+(st.regs.length===1?' regular':' regulares')):'')+(!st.fails.length&&!st.regs.length&&st.answered>0?pill({s:'ok'},'Todo bueno'):'');
    return '<li><span class="grow"><b>'+esc((x.fecha||'').split('-').reverse().join('-'))+'</b> · '+(v?esc(shortName(v))+' <span class="plate">'+esc(v.patente)+'</span>':'Vehículo eliminado')+'<br><span class="hint">'+fmt(x.km)+' km · Chofer: '+esc(x.chofer)+(x.peoneta?' · Peoneta: '+esc(x.peoneta):'')+'</span></span>'+pills+(v?'<button class="btn sm" data-act="chk-go" data-id="'+esc(x.id)+'" data-vid="'+esc(x.vid)+'">Ver</button>':'')+'</li>';
  }).join('')+'</ul>';
  if(L.length>5) h+='<p style="margin-top:8px"><button class="link" data-act="recent-more">'+(ui.recentAll?'Ver menos':'Ver más checklists ('+Math.min(L.length,20)+')')+'</button>'+(ui.recentAll&&L.length>20?' <span class="hint">· se muestran los últimos 20; los demás están en el checklist de cada vehículo</span>':'')+'</p>';
  el.innerHTML=h;
}

var EMAIL_RE=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;

function takeNewEmails(){
  var inp=$('#cf-email-new'); if(!inp||!inp.value.trim()) return [];
  var parts=inp.value.split(/[,;\s]+/).filter(Boolean), bad=parts.filter(function(x){return !EMAIL_RE.test(x)});
  if(bad.length){toast('Correo no válido: '+bad.join(', '),'bad');return false}

}

/* ---------- datos en vivo ---------- */
function snapColl(name,key){
  return db.collection(name).onSnapshot(function(snap){
    var o={}; snap.docs.forEach(function(d){o[d.id]=d.data()});
    S[key]=o; if(key==='veh')ui.loaded.veh=true;
    $('#sync').textContent='Datos guardados y compartidos';
    render(false);
  },function(err){ $('#sync').textContent='Sin conexión con los datos ('+(err&&err.code||'error')+')'; });
}
function start(){
  if(!window.claude||!window.claude.use){$('#sync').textContent='Esta página necesita abrirse desde Claude para guardar datos.';return}
  Promise.all([window.claude.use('db'),window.NDM_ME_P||Promise.resolve(null)]).then(function(r){
    var d=r[0], me=r[1];
    if(!d){$('#sync').textContent='No se pudo conectar con el almacenamiento.';$('#p-veh').innerHTML='<div class="card"><p class="empty">No se pudo conectar con los datos guardados. Recarga la página.</p></div>';return}
    db=d;
    ui.role=me?me.role:null;
    var chofer=ui.role==='chofer';
    if(chofer){document.body.classList.add('solo','chofer'); $('#soloOff').hidden=true; ui.tab='chk'}
    unsub.push(snapColl('vehicles','veh'));
    unsub.push(snapColl('kmlog','km'));
    unsub.push(db.doc('settings/personal').onSnapshot(function(s){ S.people=(s.exists&&s.data().names)||[]; render(false)},function(){}));
    if(chofer){render(true);return} // el chofer solo ve el checklist: no se cargan checklists, alertas ni repuestos
    unsub.push(snapColl('checklists','chk'));
    unsub.push(db.doc('settings/alerts').onSnapshot(function(s){
      if(s.exists){ S.cfg=Object.assign({emails:[],mantOn:true,mantKm:1000,rtOn:true,permOn:true},s.data()); if(!Array.isArray(S.cfg.emails)||!S.cfg.emails.length) S.cfg.emails=S.cfg.email?[S.cfg.email]:[]; }
      render(false)},function(){}));
    unsub.push(db.doc('settings/repuestos').onSnapshot(function(s){ S.rep={items:(s.exists&&s.data().items)||[]}; render(false)},function(){}));
  });
}
if(/checklist/i.test(location.hash||'')){document.body.classList.add('solo');ui.tab='chk';$('#soloOff').hidden=false;$('#soloOff').onclick=function(){document.body.classList.remove('solo');$('#soloOff').hidden=true;ui.tab='veh';render(true)}}
render(true);
start();
})();
